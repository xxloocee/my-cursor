name: Release desktop app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured" >&2
            exit 1
          fi

      - name: Read and verify app version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          package_version=$(node -p "require('./apps/desktop/package.json').version")
          cargo_version=$(sed -n '/^version = / { s/version = "\([^"]*\)"/\1/p; q; }' apps/desktop/src-tauri/Cargo.toml)
          test "${version}" = "${package_version}"
          test "${version}" = "${cargo_version}"
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF_NAME}" = "v${version}"
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tag must point to a commit contained in origin/main" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check whether this version is already published
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          state=$(gh release view "v${VERSION}" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || true)
          if [[ "${state}" = "published" ]]; then
            echo "Version ${VERSION} is already published; nothing to do."
            echo "should_publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "should_publish=true" >> "${GITHUB_OUTPUT}"
          fi

  publish:
    name: Publish (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            args: "--bundles deb,appimage"
            target: ""
            release_asset_pattern: "MyCursor-[version]-linux-amd64[ext]"
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            args: "--bundles deb,appimage"
            target: ""
            release_asset_pattern: "MyCursor-[version]-linux-arm64[ext]"
          - platform: windows-x86_64
            os: windows-latest
            args: "--bundles nsis"
            target: ""
            release_asset_pattern: "MyCursor-[version]-windows-x64[setup][ext]"
            portable_arch: amd64
          - platform: windows-aarch64
            os: windows-11-arm
            args: "--bundles nsis"
            target: ""
            release_asset_pattern: "MyCursor-[version]-windows-arm64[setup][ext]"
            portable_arch: arm64
          - platform: macos-aarch64
            os: macos-15
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            target: aarch64-apple-darwin
            release_asset_pattern: "MyCursor-[version]-macos-arm64[ext]"
          - platform: macos-x86_64
            os: macos-15-intel
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            target: x86_64-apple-darwin
            release_asset_pattern: "MyCursor-[version]-macos-x64[ext]"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ contains(matrix.platform, 'macos') && '-' || '' }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: ${{ contains(needs.prepare.outputs.version, '-') && format('My Cursor v{0} Beta', needs.prepare.outputs.version) || format('My Cursor v{0}', needs.prepare.outputs.version) }}
          releaseBody: |
            ## 下载说明

            | 系统 | 架构 | 安装包 | 免安装版 |
            | --- | --- | --- | --- |
            | Windows | x64 | `MyCursor-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe` | `MyCursor-${{ needs.prepare.outputs.version }}-amd64.exe` |
            | Windows | ARM64 | `MyCursor-${{ needs.prepare.outputs.version }}-windows-arm64-setup.exe` | `MyCursor-${{ needs.prepare.outputs.version }}-arm64.exe` |
            | Linux | amd64 | `MyCursor-${{ needs.prepare.outputs.version }}-linux-amd64.deb` | - |
            | Linux | arm64 | `MyCursor-${{ needs.prepare.outputs.version }}-linux-arm64.deb` | - |
            | macOS | Apple Silicon | `MyCursor-${{ needs.prepare.outputs.version }}-macos-arm64.dmg` | - |
            | macOS | Intel | `MyCursor-${{ needs.prepare.outputs.version }}-macos-x64.dmg` | - |

            使用教程：[https://doc.ergouzi.life/apps/my-cursor](https://doc.ergouzi.life/apps/my-cursor)

            下载 `SHA256SUMS` 可校验安装包完整性。其余归档、签名文件以及 `latest.json`、`portable-latest.json`、`update.json` 供应用自动更新使用。
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: ${{ matrix.release_asset_pattern }}
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-update-${{ matrix.platform }}
          path: latest.json
          if-no-files-found: error

      - name: Package legacy Linux updater asset
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p legacy-update
          tar -czf "legacy-update/MyCursor-${VERSION}-linux-amd64.tar.gz" -C target/release cursor-byok-desktop

      - name: Package and sign legacy Windows updater asset
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force legacy-update | Out-Null
          $asset = "legacy-update/MyCursor-$env:VERSION-windows-amd64.zip"
          Compress-Archive -LiteralPath target/release/cursor-byok-desktop.exe -DestinationPath $asset
          Push-Location apps/desktop
          npm exec tauri signer sign -- "../../$asset"
          Pop-Location
          $entries = @(tar -tf $asset)
          if ($entries.Count -ne 1 -or [System.IO.Path]::GetFileName($entries[0]) -ne 'cursor-byok-desktop.exe') {
            throw "Windows updater archive must contain only cursor-byok-desktop.exe"
          }
          if (!(Test-Path "$asset.sig")) {
            throw "Windows updater archive signature was not generated"
          }

      - name: Package legacy macOS updater asset
        if: contains(matrix.platform, 'macos')
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p legacy-update
          archive=$(find "target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)
          test -n "${archive}"
          legacy_platform=macos-arm64
          if [[ "${{ matrix.platform }}" = "macos-x86_64" ]]; then
            legacy_platform=macos-x64
          fi
          cp "${archive}" "legacy-update/MyCursor-${VERSION}-${legacy_platform}.tar.gz"

      - name: Package Windows portable executable
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PORTABLE_ARCH: ${{ matrix.portable_arch }}
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item -LiteralPath target/release/cursor-byok-desktop.exe -Destination "release-assets/MyCursor-$env:VERSION-$env:PORTABLE_ARCH.exe"

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux-x86_64' || matrix.platform == 'windows-x86_64' || contains(matrix.platform, 'macos')
        with:
          name: legacy-update-${{ matrix.platform }}
          path: legacy-update/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: startsWith(matrix.platform, 'windows-')
        with:
          name: primary-release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  finalize:
    name: Publish GitHub Release
    needs: [prepare, publish]
    if: needs.prepare.outputs.should_publish == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: legacy-update-*
          path: legacy-update
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: primary-release-*
          path: primary-release
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: tauri-update-*
          path: tauri-update-input

      - name: Upload Windows portable executables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release upload "v${VERSION}" primary-release/* --clobber

      - name: Generate legacy update manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node .github/scripts/generate-legacy-update.mjs \
            --version "${VERSION}" \
            --repository "${GITHUB_REPOSITORY}" \
            --assets-dir legacy-update \
            --output legacy-update/update.json \
            --notes "My Cursor v${VERSION}"

      - name: Generate signed Windows portable update manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          asset="MyCursor-${VERSION}-windows-amd64.zip"
          test -f "legacy-update/${asset}"
          test -f "legacy-update/${asset}.sig"
          node .github/scripts/generate-portable-update.mjs \
            --version "${VERSION}" \
            --repository "${GITHUB_REPOSITORY}" \
            --asset "${asset}" \
            --signature "legacy-update/${asset}.sig" \
            --output legacy-update/portable-latest.json

      - name: Normalize Tauri updater download URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p tauri-update
          release_id=$(
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"v${VERSION}\") | .id"
          )
          test -n "${release_id}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > tauri-update/release.json
          node .github/scripts/normalize-tauri-update.mjs \
            --manifests-dir tauri-update-input \
            --manifest tauri-update/latest.json \
            --release tauri-update/release.json \
            --repository "${GITHUB_REPOSITORY}" \
            --version "${VERSION}"

      - name: Upload normalized Tauri updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release upload "v${VERSION}" tauri-update/latest.json --clobber

      - name: Upload legacy updater assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release upload "v${VERSION}" legacy-update/* --clobber

      - name: Generate and upload SHA256 checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          assets=(
            "MyCursor-${VERSION}-amd64.exe"
            "MyCursor-${VERSION}-arm64.exe"
            "MyCursor-${VERSION}-linux-amd64.deb"
            "MyCursor-${VERSION}-linux-arm64.deb"
            "MyCursor-${VERSION}-macos-arm64.dmg"
            "MyCursor-${VERSION}-macos-x64.dmg"
            "MyCursor-${VERSION}-windows-arm64-setup.exe"
            "MyCursor-${VERSION}-windows-x64-setup.exe"
          )
          patterns=()
          for asset in "${assets[@]}"; do
            patterns+=(--pattern "${asset}")
          done
          mkdir -p checksum-assets
          gh release download "v${VERSION}" "${patterns[@]}" --dir checksum-assets
          test "$(find checksum-assets -maxdepth 1 -type f | wc -l)" -eq "${#assets[@]}"
          (
            cd checksum-assets
            sha256sum "${assets[@]}" | sort -k2
          ) > SHA256SUMS
          gh release upload "v${VERSION}" SHA256SUMS --clobber

      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v${VERSION}" --draft=false --latest
